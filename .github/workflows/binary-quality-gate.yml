name: binary-quality-gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  repository-policy:
    uses: ./.github/workflows/ip-gate.yml

  studio-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub App token for private runtime checkouts
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKULD_RELEASE_APP_ID }}
          private-key: ${{ secrets.SKULD_RELEASE_APP_PRIVATE_KEY }}
          owner: skuldllc
          repositories: skuldbot-executor,skuldbot-compiler

      - name: Checkout Executor resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-executor
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-executor

      - name: Checkout Compiler resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-compiler
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-compiler

      - name: Link runtime resources to Tauri bundle paths
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/skuldbot-executor" "$GITHUB_WORKSPACE/../skuldbot-executor"
          ln -s "$GITHUB_WORKSPACE/skuldbot-compiler" "$GITHUB_WORKSPACE/../skuldbot-compiler"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Frontend verification
        run: pnpm run verify:ui

      - name: Planner flow verification
        run: pnpm run test:planner-flow

      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Verify private Compiler resource contract
        run: |
          jq --exit-status \
            '.bundle.resources | has("../../skuldbot-compiler/python")' \
            src-tauri/tauri.conf.json
          jq --exit-status \
            '.bundle.resources | has("../../skuldbot-executor/python")' \
            src-tauri/tauri.conf.json

      - name: Tauri backend tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml
