name: release

on:
  push:
    tags:
      - 'studio-v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy-gates:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Create GitHub App token for private runtime checkouts
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKULD_RELEASE_APP_ID }}
          private-key: ${{ secrets.SKULD_RELEASE_APP_PRIVATE_KEY }}
          owner: skuldllc
          repositories: skuldbot-executor,skuldbot-compiler

      - name: Checkout Executor resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-executor
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-executor

      - name: Checkout Compiler resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-compiler
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-compiler

      - name: Link runtime resources to Tauri bundle paths
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/skuldbot-executor" "$GITHUB_WORKSPACE/../skuldbot-executor"
          ln -s "$GITHUB_WORKSPACE/skuldbot-compiler" "$GITHUB_WORKSPACE/../skuldbot-compiler"

      - name: Resolve immutable release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            TAG="studio-v${VERSION}"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#studio-v}"
          fi
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid version '$VERSION'. Expected semantic version like 1.0.0."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Do not reuse release versions."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit

      - name: Frontend verification
        run: pnpm run verify:ui

      - name: Planner flow verification
        run: pnpm run test:planner-flow

      - name: Verify private runtime resource contract
        run: |
          jq --exit-status '.bundle.resources | has("../../skuldbot-compiler/python")' src-tauri/tauri.conf.json
          jq --exit-status '.bundle.resources | has("../../skuldbot-executor/python")' src-tauri/tauri.conf.json

      - name: Tauri backend tests
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    needs: policy-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64
          - platform: macos-13
            target: x86_64-apple-darwin
            artifact_name: macos-intel
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Create GitHub App token for private runtime checkouts
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.SKULD_RELEASE_APP_ID }}
          private-key: ${{ secrets.SKULD_RELEASE_APP_PRIVATE_KEY }}
          owner: skuldllc
          repositories: skuldbot-executor,skuldbot-compiler

      - name: Checkout Executor resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-executor
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-executor

      - name: Checkout Compiler resource
        uses: actions/checkout@v4
        with:
          repository: skuldllc/skuldbot-compiler
          token: ${{ steps.app-token.outputs.token }}
          path: skuldbot-compiler

      - name: Link runtime resources to Tauri bundle paths
        shell: bash
        run: |
          set -euo pipefail
          ln -s "$GITHUB_WORKSPACE/skuldbot-executor" "$GITHUB_WORKSPACE/../skuldbot-executor"
          ln -s "$GITHUB_WORKSPACE/skuldbot-compiler" "$GITHUB_WORKSPACE/../skuldbot-compiler"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf

      - name: Install Windows dependencies
        if: matrix.platform == 'windows-latest'
        run: |
          vcpkg install openssl:x64-windows-static-md
          echo "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\\installed\\x64-windows-static-md" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      - name: Require Apple signing secrets for macOS releases
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Import Apple certificate
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.policy-gates.outputs.version }}"
          node -e 'const fs=require("fs"); const p="src-tauri/tauri.conf.json"; const data=JSON.parse(fs.readFileSync(p,"utf8")); data.version=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(data, null, 2)+"\n");'
        env:
          VERSION: ${{ needs.policy-gates.outputs.version }}

      - name: Build Tauri app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENSSL_STATIC: '1'
        run: pnpm tauri build -- --target ${{ matrix.target }}

      - name: Notarize macOS DMG
        if: contains(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name '*.dmg' | head -1)"
          test -f "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG_PATH"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skuldbot-studio-${{ matrix.artifact_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    needs: [policy-gates, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.policy-gates.outputs.version }}"
          mkdir -p "release/$VERSION"
          find artifacts -type f -exec cp {} "release/$VERSION/" \;
          cd "release/$VERSION"
          cat > manifest.json <<JSON
          {
            "artifact": "skuldbot-studio",
            "version": "$VERSION",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "repository": "${GITHUB_REPOSITORY}",
            "commit_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}"
          }
          JSON
          sha256sum * > SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Sign release checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "release/${{ needs.policy-gates.outputs.version }}"
          cosign sign-blob SHA256SUMS \
            --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.policy-gates.outputs.tag }}
          files: release/${{ needs.policy-gates.outputs.version }}/*
